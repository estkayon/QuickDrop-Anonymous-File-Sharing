<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070d"/>
      <stop offset="50%" stop-color="#0e0e18"/>
      <stop offset="100%" stop-color="#07070d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b5bff"/>
      <stop offset="100%" stop-color="#c8ff00"/>
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b5bff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b5bff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="600"><animate attributeName="x1" values="0;1200" dur="60s" repeatCount="indefinite"/><animate attributeName="x2" values="0;1200" dur="60s" repeatCount="indefinite"/></line>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
    <line x1="800" y1="0" x2="800" y2="600"/>
    <line x1="900" y1="0" x2="900" y2="600"/>
    <line x1="1000" y1="0" x2="1000" y2="600"/>
    <line x1="1100" y1="0" x2="1100" y2="600"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Animated glow orbs -->
  <circle cx="300" cy="300" r="200" fill="url(#glowG)" opacity="0.4">
    <animate attributeName="cx" values="300;350;300" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="300;260;300" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="300" r="180" fill="#c8ff00" opacity="0.03">
    <animate attributeName="cx" values="900;850;900" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="300;340;300" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Logo icon -->
  <g transform="translate(520, 120)" filter="url(#glow)">
    <rect width="80" height="80" rx="16" fill="#0e0e18" stroke="url(#accent)" stroke-width="1.5"/>
    <path d="M40 18 L40 52" stroke="url(#accent)" stroke-width="6" stroke-linecap="round">
      <animate attributeName="d" values="M40 18 L40 52;M40 14 L40 56;M40 18 L40 52" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M26 42 L40 58 L54 42" stroke="#c8ff00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <animate attributeName="d" values="M26 42 L40 58 L54 42;M26 38 L40 62 L54 38;M26 42 L40 58 L54 42" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M24 68 L56 68" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="600" y="260" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="900" letter-spacing="-2" fill="#e8e8ed">
    Quick<tspan fill="#c8ff00">Drop</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="300" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#7a7a94" letter-spacing="0.5">
    Anonymous P2P File Sharing &amp; Real-Time Chat
  </text>

  <!-- Feature tags -->
  <g transform="translate(600, 340)" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
    <!-- Tag 1 -->
    <rect x="-230" y="-14" width="100" height="28" rx="14" fill="none" stroke="#3b5bff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="-180" y="5" fill="#7a7a94" letter-spacing="0.8">WebRTC</text>
    <!-- Tag 2 -->
    <rect x="-110" y="-14" width="100" height="28" rx="14" fill="none" stroke="#3b5bff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="-60" y="5" fill="#7a7a94" letter-spacing="0.8">ENCRYPTED</text>
    <!-- Tag 3 -->
    <rect x="10" y="-14" width="100" height="28" rx="14" fill="none" stroke="#c8ff00" stroke-opacity="0.2" stroke-width="1"/>
    <text x="60" y="5" fill="#7a7a94" letter-spacing="0.8">NO TRACE</text>
    <!-- Tag 4 -->
    <rect x="130" y="-14" width="100" height="28" rx="14" fill="none" stroke="#c8ff00" stroke-opacity="0.2" stroke-width="1"/>
    <text x="180" y="5" fill="#7a7a94" letter-spacing="0.8">REAL-TIME</text>
  </g>

  <!-- Animated particles -->
  <g opacity="0.5">
    <circle cx="150" cy="150" r="2" fill="#3b5bff">
      <animate attributeName="cy" values="150;100;150" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="200" r="1.5" fill="#c8ff00">
      <animate attributeName="cy" values="200;150;200" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="450" r="1.5" fill="#3b5bff">
      <animate attributeName="cy" values="450;400;450" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="480" r="2" fill="#c8ff00">
      <animate attributeName="cy" values="480;430;480" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="500" r="1" fill="#3b5bff">
      <animate attributeName="cy" values="500;460;500" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Connection lines animated -->
  <g stroke="#3b5bff" stroke-opacity="0.08" stroke-width="1">
    <line x1="200" y1="450" x2="600" y2="420">
      <animate attributeName="stroke-opacity" values="0.05;0.15;0.05" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="420" x2="1000" y2="460">
      <animate attributeName="stroke-opacity" values="0.05;0.12;0.05" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- P2P nodes -->
  <g>
    <!-- Node 1 -->
    <circle cx="200" cy="450" r="24" fill="#0e0e18" stroke="#3b5bff" stroke-opacity="0.2" stroke-width="1">
      <animate attributeName="r" values="24;26;24" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="200" y="455" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#7a7a94">Peer A</text>

    <!-- Node 2 -->
    <circle cx="600" cy="420" r="28" fill="#0e0e18" stroke="#c8ff00" stroke-opacity="0.15" stroke-width="1">
      <animate attributeName="r" values="28;30;28" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text x="600" y="425" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#7a7a94">Server</text>

    <!-- Node 3 -->
    <circle cx="1000" cy="460" r="24" fill="#0e0e18" stroke="#3b5bff" stroke-opacity="0.2" stroke-width="1">
      <animate attributeName="r" values="24;26;24" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <text x="1000" y="465" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#7a7a94">Peer B</text>
  </g>

  <!-- Data transfer animation -->
  <circle r="3" fill="#c8ff00" opacity="0.8">
    <animateMotion dur="3s" repeatCount="indefinite" path="M200,450 Q400,410 600,420"/>
  </circle>
  <circle r="3" fill="#3b5bff" opacity="0.8">
    <animateMotion dur="3s" repeatCount="indefinite" path="M600,420 Q800,440 1000,460"/>
  </circle>

  <!-- Bottom border line -->
  <rect x="0" y="596" width="1200" height="4" fill="url(#accent)" opacity="0.5"/>
</svg>